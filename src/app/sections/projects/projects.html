<section id="projects" class="projects-section section-base">
  <div class="section-header">
    <div class="section-label">
      <div class="section-icon">◫</div>
      <span>Projets</span>
    </div>
    <app-mascot outfit="projects" [size]="280"/>
  </div>
  <h2 class="section-h2">Ce que j'ai construit</h2>

  <div class="proj-filters">
    @for (f of filters; track f) {
      <button
        class="filter-btn"
        [class.active]="activeFilter() === f"
        (click)="setFilter(f)"
      >{{ f }}</button>
    }
  </div>

  <div class="proj-grid">
    @for (p of filtered; track p.slug) {
      <a class="proj-card reg-mark" [routerLink]="['/projets', p.slug]">
        <span class="rm-bl">+</span><span class="rm-br">+</span>
        <div class="proj-capture">
          <div class="proj-placeholder">
            <span class="proj-num">{{ p.num }}</span>
          </div>
        </div>
        <div class="proj-body">
          <div class="proj-meta">
            <span class="proj-num-label">{{ p.num }}</span>
            <span class="proj-year">{{ p.year }}</span>
          </div>
          <h3 class="proj-title">{{ p.title }}</h3>
          <p class="proj-desc">{{ p.description }}</p>
          <div class="proj-tags">
            @for (tag of p.tags; track tag) {
              <span class="tag tag-sm">{{ tag }}</span>
            }
          </div>
        </div>
      </a>
    }
  </div>
</section>
